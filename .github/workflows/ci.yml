name: Cross-platform verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.18'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high --ignore-scripts
      - run: bun run build
      - run: bun run typecheck
      - name: Core and native runtime tests
        run: bun test tests/engine.test.ts tests/feishu.test.ts tests/install.test.ts tests/node-runtime.test.ts tests/platform.test.ts tests/schedule.test.ts tests/security.test.ts tests/sqlite.test.ts tests/dependencies.test.ts tests/browser.test.ts tests/browser-install.test.ts tests/ops-install.test.ts tests/quote.test.ts tests/import.test.ts tests/collector.test.ts
      - run: bun run test:integration --installed-project
      - name: Browser plugin load before browser installation
        run: bun scripts/browser-fixture-build.ts && node .data/browser-chain.js --load-only
      - run: bunx playwright install --with-deps chromium
      - run: bun test tests/ui.test.ts
      - name: Isolated Feishu to browser chain
        run: node .data/browser-chain.js
      - run: bun run scan
      - run: bun run scan:release
